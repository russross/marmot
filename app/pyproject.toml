[project]
name = "marmot-timetable-chat"
version = "0.1.0"
description = "Faculty chat interface for Marmot timetabling input"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "ty>=0.0.1a16",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "timetable_chat"
module-root = "src"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "PTH", "RUF", "S", "SIM", "T20", "UP"]
ignore = ["COM812"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
