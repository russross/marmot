[package]
name = "marmot"
version = "0.3.0"
edition = "2024"

[dependencies]
fastrand = { version = "2.4.1", optional = true }
itertools = { version = "0.15.0", optional = true }
kissat = { path = "kissat", optional = true }
sqlite = { version = "0.37.0", optional = true }

[features]
default = ["cli"]
sqlite = ["dep:sqlite"]
search = ["dep:fastrand"]
sat = ["dep:kissat", "dep:itertools", "dep:fastrand"]
cli = ["sqlite", "search", "sat"]

[[bin]]
name = "marmot"
path = "src/main.rs"
required-features = ["cli"]
